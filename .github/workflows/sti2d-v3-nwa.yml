name: Build STI2D OS V3 NWA

on:
  push:
    branches:
      - sti2d-os-native-build
    paths:
      - ".sti2d-v3/**"
      - ".github/workflows/sti2d-v3-nwa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3
          node --version
          npm --version

      - name: Prepare source
        run: |
          rm -rf /tmp/epsilon
          git clone --depth 1 https://github.com/numworks/epsilon.git /tmp/epsilon
          APP=/tmp/epsilon/epsilon/external_apps/sti2d_os
          mkdir -p "$APP/src"

          cat .sti2d-v3/chunks/00a.txt .sti2d-v3/chunks/00b.txt .sti2d-v3/chunks/00c.txt .sti2d-v3/chunks/01.txt .sti2d-v3/chunks/02.txt .sti2d-v3/chunks/03.txt .sti2d-v3/chunks/04.txt > /tmp/main.c.gz.b64
          test "$(wc -c < /tmp/main.c.gz.b64)" -eq 12712
          base64 -d /tmp/main.c.gz.b64 | gzip -d > "$APP/src/main.c"
          test "$(wc -c < "$APP/src/main.c")" -eq 29952

          printf '%s\n' \
            'APP_NAME = sti2d_os' \
            'APP_ICON = src/icon.png' \
            'OUTPUT_DIR = output' \
            'SOURCES = $(addprefix src/, main.c)' \
            'include ../build/external_app.mak' \
            'LDFLAGS += -lm' > "$APP/Makefile"

          python3 -c "import base64;open('$APP/src/icon.png','wb').write(base64.b64decode(''))"

          wc -c "$APP/src/main.c"
          file "$APP/src/icon.png"

      - name: Build NWA
        run: |
          cd /tmp/epsilon/epsilon/external_apps/sti2d_os
          make PLATFORM=device build
          cp output/device/sti2d_os.nwa "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"
          file "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"
          ls -lh "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: STI2D_OS_V3_NWA
          path: STI2D_OS_V3.nwa
          if-no-files-found: error
