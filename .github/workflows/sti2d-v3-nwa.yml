name: Build STI2D OS V3 NWA

on:
  push:
    branches:
      - sti2d-os-native-build
    paths:
      - ".sti2d-v3/**"
      - ".github/workflows/sti2d-v3-nwa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3
          node --version
          npm --version

      - name: Prepare source
        run: |
          rm -rf /tmp/epsilon
          git clone --depth 1 https://github.com/numworks/epsilon.git /tmp/epsilon
          APP=/tmp/epsilon/epsilon/external_apps/sti2d_os
          mkdir -p "$APP/src"
          base64 -d .sti2d-v3/main.c.gz.b64 | gzip -d > "$APP/src/main.c"

          cat > "$APP/Makefile" <<'EOF'
          APP_NAME = sti2d_os
          APP_ICON = src/icon.png
          OUTPUT_DIR = output
          SOURCES = $(addprefix src/, main.c)
          include ../build/external_app.mak
          LDFLAGS += -lm
          EOF

          python3 - <<'PY'
          import struct,zlib
          out='/tmp/epsilon/epsilon/external_apps/sti2d_os/src/icon.png'
          w,h=55,56
          rows=[]
          for y in range(h):
              row=bytearray([0])
              for x in range(w):
                  dx=x-27; dy=y-28
                  if dx*dx+dy*dy<24*24:
                      t=(x+y)/(w+h)
                      r=int(80+80*t); g=int(70+70*t); b=int(230+20*t)
                  else:
                      r=g=b=0
                  row+=bytes((r,g,b,255))
              rows.append(bytes(row))
          raw=b''.join(rows)
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open(out,'wb').write(png)
          PY

          wc -c "$APP/src/main.c"
          file "$APP/src/icon.png"

      - name: Build NWA
        run: |
          cd /tmp/epsilon/epsilon/external_apps/sti2d_os
          make PLATFORM=device build
          cp output/device/sti2d_os.nwa "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"
          file "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"
          ls -lh "$GITHUB_WORKSPACE/STI2D_OS_V3.nwa"

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: STI2D_OS_V3_NWA
          path: STI2D_OS_V3.nwa
          if-no-files-found: error
