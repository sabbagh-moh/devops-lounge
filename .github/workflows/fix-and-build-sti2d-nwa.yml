name: build-sti2d-nwa

on:
  push:
    branches:
      - sti2d-os-native-build
    paths:
      - ".github/workflows/fix-and-build-sti2d-nwa.yml"
      - ".sti2d-src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make python3 nodejs npm

      - name: Prepare source
        run: |
          mkdir -p /tmp/sti2d
          cp -R .sti2d-src/sti2d_os_native /tmp/sti2d/sti2d_os_native
          echo 'LDFLAGS += --specs=nosys.specs' >> /tmp/sti2d/sti2d_os_native/Makefile

      - name: Checkout Epsilon
        uses: actions/checkout@v4
        with:
          repository: numworks/epsilon
          path: epsilon
          ref: master

      - name: Install source
        run: |
          rm -rf epsilon/epsilon/external_apps/sti2d_os
          cp -R /tmp/sti2d/sti2d_os_native epsilon/epsilon/external_apps/sti2d_os

      - name: Build
        working-directory: epsilon/epsilon/external_apps/sti2d_os
        run: make PLATFORM=device build V=1

      - name: Verify installer conversion
        working-directory: epsilon/epsilon/external_apps/sti2d_os
        run: |
          npx --yes -- nwlink@1.0.0 nwa-bin output/device/sti2d_os.nwa output/device/sti2d_os.bin
          ls -lh output/device/sti2d_os.nwa output/device/sti2d_os.bin

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: STI2D-OS-UI-V3
          path: epsilon/epsilon/external_apps/sti2d_os/output/device/sti2d_os.nwa
