name: Build STI2D Lessons V5 NWA

on:
  push:
    branches:
      - sti2d-os-native-build
    paths:
      - ".sti2d-v5/**"
      - ".github/workflows/sti2d-v5-nwa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev make python3 xz-utils
      - name: Assemble validated modules
        run: |
          git clone --depth 1 https://github.com/numworks/epsilon.git /tmp/epsilon
          APP=/tmp/epsilon/epsilon/external_apps/sti2d_os
          mkdir -p "$APP/src"

          cat .sti2d-v3/chunks/00a.txt .sti2d-v3/chunks/00b.txt .sti2d-v3/chunks/00c.txt .sti2d-v3/chunks/01.txt .sti2d-v3/chunks/02.txt .sti2d-v3/chunks/03.txt .sti2d-v3/chunks/04.txt > /tmp/main-v3.gz.b64
          test "$(wc -c < /tmp/main-v3.gz.b64)" -eq 12712
          base64 -d /tmp/main-v3.gz.b64 | gzip -d > "$APP/src/main.c"
          test "$(wc -c < "$APP/src/main.c")" -eq 29952

          test "$(wc -c < .sti2d-v4/math_solver.gz.b64)" -eq 10148
          base64 -d .sti2d-v4/math_solver.gz.b64 | gzip -d > "$APP/src/math_solver.c"
          printf '%s  %s\n' 'b496122ffb70d2dad9b03b1a6b546f0352aabbf29e7c2d6a7a201d9376bc58f7' "$APP/src/math_solver.c" | sha256sum -c -

          base64 -d .sti2d-v5/exam_practice.xz.b64 | xz -d > "$APP/src/exam_practice.c"
          test "$(wc -c < "$APP/src/exam_practice.c")" -eq 16860

          python3 .sti2d-v4/patch.py "$APP/src/main.c"
          python3 .sti2d-v5/patch.py "$APP/src"

          printf '%s\n' \
            'APP_NAME = sti2d_os' \
            'APP_ICON = src/icon.png' \
            'OUTPUT_DIR = output' \
            'SOURCES = $(addprefix src/, main.c)' \
            'include ../build/external_app.mak' \
            'LDFLAGS += -lm' > "$APP/Makefile"

      - name: Compile NWA
        run: |
          cd /tmp/epsilon/epsilon/external_apps/sti2d_os
          make PLATFORM=device build
          cp output/device/sti2d_os.nwa "$GITHUB_WORKSPACE/STI2D_EXERCICES_V5.nwa"
          file "$GITHUB_WORKSPACE/STI2D_EXERCICES_V5.nwa"
          ls -lh "$GITHUB_WORKSPACE/STI2D_EXERCICES_V5.nwa"
      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: STI2D_EXERCICES_V5_NWA
          path: STI2D_EXERCICES_V5.nwa
          if-no-files-found: error
