name: build-sti2d-os-native

on:
  push:
    branches:
      - sti2d-os-native-build
    paths:
      - ".sti2d-build/**"
      - ".github/workflows/build-sti2d-os-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make unzip python3 nodejs npm

      - name: Decode STI2D source bundle
        run: |
          mkdir -p /tmp/sti2d
          base64 -d .sti2d-build/sti2d_os_native_source.zip.b64 > /tmp/sti2d/source.zip
          unzip -q /tmp/sti2d/source.zip -d /tmp/sti2d/src

      - name: Checkout NumWorks Epsilon
        uses: actions/checkout@v4
        with:
          repository: numworks/epsilon
          path: epsilon
          ref: master

      - name: Install external app source
        run: |
          rm -rf epsilon/epsilon/external_apps/sti2d_os
          cp -R /tmp/sti2d/src/sti2d_os_native epsilon/epsilon/external_apps/sti2d_os

      - name: Build NWA
        working-directory: epsilon/epsilon/external_apps/sti2d_os
        run: |
          make clean || true
          make PLATFORM=device V=1

      - name: Verify output
        run: |
          test -f epsilon/epsilon/external_apps/sti2d_os/output/device/sti2d_os.nwa
          ls -lh epsilon/epsilon/external_apps/sti2d_os/output/device/sti2d_os.nwa

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: STI2D-OS-native
          path: epsilon/epsilon/external_apps/sti2d_os/output/device/sti2d_os.nwa
